name: Build watch app

on:
  push:
    branches-ignore: [apk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk HourlyBuzz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HourlyBuzz-apk
          path: HourlyBuzz.apk

      # Direct download link: https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" HourlyBuzz.apk \
            --target "${{ github.sha }}" \
            --title "Hourly Buzz (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Install with: adb install -r HourlyBuzz.apk"

      # Also keep the latest APK on the 'apk' branch for easy fetching with git.
      - name: Update apk branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir out && cp HourlyBuzz.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add HourlyBuzz.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
