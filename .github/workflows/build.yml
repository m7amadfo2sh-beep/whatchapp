name: Build watch app

on:
  push:
    branches-ignore: [apk, model]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The Quran speech model (prepared by model.yml) goes into the app.
      - name: Speech model
        run: |
          git fetch --depth 1 origin model:refs/remotes/origin/model
          git show origin/model:ggml-quran-base-q5_1.bin > app/src/main/assets/ggml-quran.bin
          ls -la app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Build the speech engine for this machine so the recitation checker can be
      # tested with real recitation audio (clips on the 'model' branch).
      - name: Prepare recitation test
        run: |
          mkdir -p e2e && git archive origin/model | tar -x -C e2e
          mv e2e/ggml-quran-base-q5_1.bin e2e/model.bin
          cmake -S app/src/main/cpp -B e2e/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-I$JAVA_HOME/include -I$JAVA_HOME/include/linux"
          cmake --build e2e/build -j 4
          cp e2e/build/libhourlybuzz_whisper.so e2e/

      - name: Unit tests (including real-audio recitation test)
        env:
          RECITE_E2E: ${{ github.workspace }}/e2e
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk HourlyBuzz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HourlyBuzz-apk
          path: HourlyBuzz.apk

      # Direct download link: https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" HourlyBuzz.apk \
            --target "${{ github.sha }}" \
            --title "Hourly Buzz (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Install with: adb install -r HourlyBuzz.apk"

      # Also keep the latest APK on the 'apk' branch for easy fetching with git.
      - name: Update apk branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir out && cp HourlyBuzz.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add HourlyBuzz.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
