<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hourly Buzz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="main" class="screen">
    <div id="test-badge" class="badge" hidden>TEST MODE</div>
    <h1>Hourly Buzz</h1>
    <button id="toggle" class="toggle on" type="button">ON</button>
    <div class="rows">
      <div class="row"><span class="label">Next buzz</span><span id="next-buzz" class="value">–</span></div>
      <div class="row"><span class="label">Next picture</span><span id="next-image" class="value">–</span></div>
    </div>
    <button id="preview" class="link" type="button">Preview picture</button>
  </main>

  <section id="image-view" class="screen image-view" hidden>
    <img id="image" alt="" hidden>
    <div id="image-msg" class="image-msg">Loading…</div>
    <div id="image-caption" class="image-caption"></div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/gestures.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
